<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#f5c2e7" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle badge -->
  <circle cx="60" cy="60" r="54" fill="#181825" stroke="url(#catGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Cat Ears -->
  <path d="M28 48 L22 18 L48 34 Z" fill="#313244" stroke="#cba6f7" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M92 48 L98 18 L72 34 Z" fill="#313244" stroke="#89b4fa" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Inner Ears Pink -->
  <path d="M30 42 L26 24 L44 34 Z" fill="#f5c2e7" opacity="0.85" />
  <path d="M90 42 L94 24 L76 34 Z" fill="#f5c2e7" opacity="0.85" />

  <!-- Cat Head -->
  <ellipse cx="60" cy="64" rx="38" ry="34" fill="#1e1e2e" stroke="#45475a" stroke-width="2" />

  <!-- Cat Nix Flake Whisker Accents -->
  <!-- Left Whiskers -->
  <line x1="16" y1="62" x2="38" y2="65" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="72" x2="39" y2="72" stroke="#89b4fa" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="82" x2="42" y2="79" stroke="#74c7ec" stroke-width="2" stroke-linecap="round" />

  <!-- Right Whiskers -->
  <line x1="104" y1="62" x2="82" y2="65" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" />
  <line x1="102" y1="72" x2="81" y2="72" stroke="#89b4fa" stroke-width="2" stroke-linecap="round" />
  <line x1="98" y1="82" x2="78" y2="79" stroke="#74c7ec" stroke-width="2" stroke-linecap="round" />

  <!-- Cat Eyes (Large, expressive anime/cyber style) -->
  <ellipse cx="44" cy="62" rx="9" ry="12" fill="url(#eyeGrad)" />
  <ellipse cx="76" cy="62" rx="9" ry="12" fill="url(#eyeGrad)" />

  <!-- Pupils & Highlights -->
  <ellipse cx="45" cy="62" rx="4.5" ry="8" fill="#11111b" />
  <ellipse cx="77" cy="62" rx="4.5" ry="8" fill="#11111b" />

  <!-- Specular reflections -->
  <circle cx="42" cy="58" r="3" fill="#ffffff" />
  <circle cx="46" cy="65" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="74" cy="58" r="3" fill="#ffffff" />
  <circle cx="78" cy="65" r="1.5" fill="#ffffff" opacity="0.8" />

  <!-- Small Cute Cat Nose -->
  <polygon points="60,73 57,70 63,70" fill="#f5c2e7" />

  <!-- Cat Mouth (Moustache curve) -->
  <path d="M54 75 Q60 79 60 75 Q60 79 66 75" fill="none" stroke="#cdd6f4" stroke-width="2" stroke-linecap="round" />

  <!-- Forehead Nix Flake Micro Symbol -->
  <g transform="translate(60, 43) scale(0.65)" stroke="#cba6f7" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="-10" x2="0" y2="10" />
    <line x1="-8.66" y1="-5" x2="8.66" y2="5" />
    <line x1="-8.66" y1="5" x2="8.66" y2="-5" />
    <circle cx="0" cy="0" r="2.5" fill="#89b4fa" />
  </g>
</svg>
